databases:
  - name: workpulse-db
    databaseName: freelancer_marketplace
    user: postgres
    plan: free

services:
  # ----------------------------------------------------------------------------
  # WorkPulse AI Backend Web Service (Node.js + Express + Prisma + Socket.IO)
  # ----------------------------------------------------------------------------
  - type: web
    name: workpulse-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run db:generate --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: workpulse-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: notifications@marketplace.io

  # ----------------------------------------------------------------------------
  # WorkPulse AI Frontend Static Site (React + Vite + SPA Router)
  # ----------------------------------------------------------------------------
  - type: static
    name: workpulse-client
    rootDir: .
    buildCommand: npm install && npm run build --workspace=client
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
